<div class="shell">
  <aside class="sidebar" [class.open]="menuOpen()">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
          <path d="M5 12.5l4.5 4.5L19 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <span class="brand-name">TaskFlow</span>
    </div>

    <div class="nav-label">Workspace</div>
    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="active" (click)="close()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
        Dashboard
      </a>

      <a routerLink="/tasks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="close()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="16" rx="2.5" /><path d="M8 10l2.5 2.5L16 7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Tasks
      </a>

      @if (canManage()) {
        <a routerLink="/tasks/new" routerLinkActive="active" (click)="close()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9" /><path d="M12 8v8M8 12h8" stroke-linecap="round" />
          </svg>
          New task
        </a>

        <a routerLink="/users" routerLinkActive="active" (click)="close()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="8" r="3.5" /><path d="M3.5 19a5.5 5.5 0 0 1 11 0" stroke-linecap="round" />
            <path d="M16 5.5a3 3 0 0 1 0 5.8M17.5 19a5 5 0 0 0-3-4.6" stroke-linecap="round" />
          </svg>
          Users
        </a>
      }
    </nav>

    <div class="side-foot">
      <span class="dot"></span> Backend-enforced access
    </div>
  </aside>

  @if (menuOpen()) {
    <div class="backdrop" (click)="close()"></div>
  }

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" (click)="toggle()" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" />
        </svg>
      </button>

      <div class="spacer"></div>

      @if (user(); as u) {
        <div class="user-chip">
          <div class="avatar">{{ u.username.charAt(0).toUpperCase() }}</div>
          <div class="who">
            <span class="name">{{ u.username }}</span>
            <span class="badge badge-{{ u.role }}">{{ roleLabels[u.role] }}</span>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" (click)="logout()">Sign out</button>
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>

  <app-toasts />
  <app-confirm-dialog />
</div>
