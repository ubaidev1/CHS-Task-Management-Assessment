<div class="page narrow">
  <a routerLink="/tasks" class="back">← Back to tasks</a>

  <div class="page-head">
    <div>
      <h1 class="page-title">New task</h1>
      <p class="page-sub">Create a task and optionally assign it to someone.</p>
    </div>
  </div>

  @if (error()) { <div class="alert alert-error" style="margin-bottom:16px">{{ error() }}</div> }

  <div class="card card-pad">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label class="label" for="title">Title <span class="req">*</span></label>
        <input id="title" class="input" formControlName="title" [class.invalid]="invalidTitle()"
               placeholder="e.g. Prepare Q3 report" />
        @if (invalidTitle()) { <span class="error-text">Title is required.</span> }
      </div>

      <div class="field">
        <label class="label" for="description">Description</label>
        <textarea id="description" class="textarea" formControlName="description"
                  placeholder="Add any details that help whoever picks this up…"></textarea>
      </div>

      <div class="form-cols">
        <div class="field">
          <label class="label" for="assignee">Assign to</label>
          <select id="assignee" class="select" formControlName="assigned_to">
            <option [ngValue]="null">Unassigned</option>
            @for (u of users(); track u.id) {
              <option [ngValue]="u.id">{{ u.username }} ({{ u.role }})</option>
            }
          </select>
          <span class="hint">Leave unassigned to assign later.</span>
        </div>

        <div class="field">
          <label class="label" for="status">Initial status</label>
          <select id="status" class="select" formControlName="status">
            @for (s of statuses; track s) {
              <option [value]="s">{{ statusLabels[s] }}</option>
            }
          </select>
        </div>
      </div>

      <div class="row" style="margin-top:8px">
        <button class="btn btn-primary" type="submit" [disabled]="saving()">
          @if (saving()) { <span class="spinner" style="border-top-color:#fff"></span> Creating… }
          @else { Create task }
        </button>
        <a routerLink="/tasks" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
