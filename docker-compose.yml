# TaskFlow — full stack for local evaluation.
#
# Brings up PostgreSQL, Redis, the Django API (gunicorn), a Celery worker, and
# the Angular app (nginx). The backend runs migrations + seeds demo users on
# start. Secrets use clearly-insecure dev defaults overridable from the host env
# (e.g. DJANGO_SECRET_KEY=... docker compose up) — no real secrets are committed.

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: taskflow.settings.dev
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-change-me}
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
  DATABASE_URL: postgres://taskflow:taskflow@db:5432/taskflow
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
  CSRF_TRUSTED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment: *backend-env
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py seed_users &&
             gunicorn taskflow.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    environment: *backend-env
    command: celery -A taskflow worker -l info
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
